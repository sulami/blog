{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock title %}

{% block content %}
<ul>
    {% for post in page.extra_context.posts %}
    <li>
        <a href="{{ post.link }}">{{ post.title }}</a>
        <span class="info">({{ post.timestamp | format_date }})</span>
    </li>
    {% endfor %}
</ul>

<p>
    <a href="{{ url_for('file:input/content/tags.md') }}">All tags</a>
</p>
{% endblock content %}
