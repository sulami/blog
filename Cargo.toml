[package]
name = "blog"
version = "0.1.0"
edition = "2021"
authors = ["Robin Schroer"]
description = "Static site generator"

[features]
default = ["server"]
server = ["dep:axum", "dep:notify", "dep:tokio", "dep:tokio-stream", "dep:tower-http"]

[dependencies]
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
itertools = "0.14"
jiff = { version = "0.2", features = ["serde"] }
minijinja = { version = "2", features = ["loader"] }
pulldown-cmark = "0.13"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes", "default-themes", "html", "regex-onig"
] }
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "0.8"

# Live server dependencies
axum = { version = "0.8", optional = true }
notify = { version = "8", optional = true, default-features = false, features = [
    "macos_fsevent",
] }
tokio = { version = "1", optional = true, features = ["full"] }
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }
tower-http = { version = "0.6", optional = true, features = ["fs"] }
