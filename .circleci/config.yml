version: 2.1

orbs:
  s3: circleci/aws-s3@4.0.0
  aws: circleci/aws-cli@4.1.3

jobs:
  build:
    docker:
      - image: cimg/rust:1.85
    steps:
      - checkout
      - restore_cache:
          key: v2-{{ checksum "Cargo.lock" }}
      - run:
          name: Compile binary
          command: cargo build --no-default-features
      - save_cache:
          key: v2-{{ checksum "Cargo.lock" }}
          paths:
            - "target"
      - run:
          name: Render output
          command: >
            target/debug/blog
            --source-sha << pipeline.git.revision >>
            --source-url "<< pipeline.project.git_url >>/tree/<< pipeline.git.revision >>"
            --build-url "$CIRCLE_BUILD_URL"
            render
      - store_artifacts:
          path: output
          destination: '.'
      - when:
          condition:
            equal: [ trunk, << pipeline.git.branch >> ]
          steps:
            - aws/setup
            - s3/sync:
                from: output
                to: s3://blog.sulami.xyz
                arguments: >
                  --endpoint-url https://s3.nl-ams.scw.cloud
                  --delete
                  --checksum-algorithm SHA256

workflows:
  build-and-deploy:
    jobs:
      - build
